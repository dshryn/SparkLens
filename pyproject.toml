[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparklens"
version = "0.2.0"
description = "Spark Physical Plan Analyzer and Visualizer"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "altair",
    "matplotlib",
    "networkx",
    "pydot",
    "pyvis",
    "google-genai",
    "python-dotenv",
]

[project.scripts]
sparklens = "cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.poetry]
package-mode = false